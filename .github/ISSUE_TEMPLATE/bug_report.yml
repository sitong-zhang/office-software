name: Bug report
description: Report a problem with the application or the project site
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Search existing issues first — a duplicate may already have an answer.

        For security vulnerabilities, do not use this form. Follow [SECURITY.md](https://github.com/sitong-zhang/office-software/blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Version
      description: The release or commit where the problem occurs.
      placeholder: "e.g. 0.1.0, or commit abc1234"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Windows 11 (x64)
        - Windows 10 (x64)
        - Other (unsupported)
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps that trigger the problem.
      placeholder: |
        1. Open...
        2. Click...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages or screenshots if they help.
    validations:
      required: true

  - type: textarea
    id: document
    attributes:
      label: Sample document
      description: If the problem involves a specific file, attach a minimal copy that does not contain private data.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: This report does not contain a security vulnerability.
          required: true
