name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 msitools python3-pil curl osslsigncode openssl

      - name: Check version consistency
        run: python3 scripts/check-version.py

      - name: Prepare signing certificate
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
        run: |
          if [ -z "$SIGN_PFX_BASE64" ]; then
            echo "::error::SIGN_PFX_BASE64 is not configured. Unsigned builds are never published."
            exit 1
          fi
          mkdir -p build/signing
          printf '%s' "$SIGN_PFX_BASE64" | base64 -d > build/signing/chenyi.pfx
          chmod 600 build/signing/chenyi.pfx

      - name: Build and sign installer
        env:
          REQUIRE_SIGN: "1"
          SIGN_PFX_PASS: ${{ secrets.SIGN_PFX_PASS }}
        run: ./scripts/build-windows.sh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ChenyiOffice-windows-x64
          path: |
            dist/ChenyiOffice-*-x64.exe
            dist/ChenyiOffice-*-x64.exe.sha256
            dist/ChenyiOffice-code-signing.cer
            dist/ChenyiOffice-code-signing.cer.sha256
          if-no-files-found: error
