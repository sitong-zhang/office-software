name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 msitools python3-pil curl osslsigncode openssl fonts-noto-cjk librsvg2-bin wine64

      - name: Check version consistency
        run: python3 scripts/check-version.py

      - name: Prepare signing certificate
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
        run: |
          if [ -z "$SIGN_PFX_BASE64" ]; then
            echo "::error::SIGN_PFX_BASE64 is not configured. Unsigned builds are never published."
            exit 1
          fi
          mkdir -p build/signing
          printf '%s' "$SIGN_PFX_BASE64" | base64 -d > build/signing/chenyi.pfx
          chmod 600 build/signing/chenyi.pfx

      - name: Build and sign installer
        env:
          REQUIRE_SIGN: "1"
          SIGN_PFX_PASS: ${{ secrets.SIGN_PFX_PASS }}
        run: ./scripts/build-windows.sh

      # Routine gate: the launcher's non-interactive self-test calls the same
      # production functions as the UI (profile merge, version floor, redirect
      # allow-list, manifest validation). Run it on every build via Wine so a
      # regression fails the build, not just an opt-in smoke run.
      - name: Launcher self-test (Wine)
        env:
          WINEDEBUG: "-all"
          WINEPREFIX: ${{ github.workspace }}/build/wine-prefix
        run: |
          set -euo pipefail
          out=build/self-test.log
          wine64 build/ChenyiOffice.exe "--self-test=$PWD/$out"
          cat "$out"
          grep -Eq 'TOTAL [0-9]+ passed, 0 failed' "$out"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ChenyiOffice-windows-x64
          path: |
            dist/ChenyiOffice-*-x64.exe
            dist/ChenyiOffice-*-x64.exe.sha256
            dist/ChenyiOffice-code-signing.cer
            dist/ChenyiOffice-code-signing.cer.sha256
          if-no-files-found: error
