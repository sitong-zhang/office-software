name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 msitools python3-pil curl

      - name: Build installer
        run: ./scripts/build-windows.sh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ChenyiOffice-windows-x64
          path: |
            dist/ChenyiOffice-0.1.0-x64.exe
            dist/ChenyiOffice-0.1.0-x64.exe.sha256
          if-no-files-found: error
