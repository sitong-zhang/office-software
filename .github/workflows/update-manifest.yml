name: Publish update manifest

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (leave empty for the latest release)
        required: false
        type: string

permissions:
  contents: write

jobs:
  manifest:
    runs-on: windows-latest
    steps:
      - name: Build and attach latest.json
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          MIN_SUPPORTED_VERSION: ${{ vars.MIN_SUPPORTED_VERSION }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY

          $tag = $env:INPUT_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = gh release view --repo $repo --json tagName --jq '.tagName'
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "No release tag available."
          }

          $release = gh release view $tag --repo $repo --json tagName,url,publishedAt,assets | ConvertFrom-Json
          $version = $release.tagName -replace '^v', ''

          # Never pick the bundled engine MSI: only the installer EXE is an
          # update payload. The MSI is a large build input attached alongside it.
          $installer = $release.assets |
            Where-Object { $_.name -match '^ChenyiOffice-.*-x64\.exe$' } |
            Select-Object -First 1

          if (-not $installer) {
            Write-Host "No x64 installer attached to $tag; skipping manifest."
            exit 0
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          gh release download $tag --repo $repo --pattern $installer.name --dir dist

          $path = Join-Path 'dist' $installer.name
          $hash = (Get-FileHash -Algorithm SHA256 -Path $path).Hash.ToLowerInvariant()
          $size = (Get-Item $path).Length
          $url = "https://github.com/$repo/releases/download/$tag/$($installer.name)"
          $min = if ([string]::IsNullOrWhiteSpace($env:MIN_SUPPORTED_VERSION)) { '0.0.0' } else { $env:MIN_SUPPORTED_VERSION }

          $manifest = [ordered]@{
            version               = $version
            mandatory             = $false
            min_supported_version = $min
            published_at          = $release.publishedAt
            release_notes_url     = $release.url
            installer             = [ordered]@{
              url    = $url
              sha256 = $hash
              size   = $size
            }
          }

          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 -NoNewline latest.json
          gh release upload $tag latest.json --clobber --repo $repo
